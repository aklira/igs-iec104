[graph]
all-features = true

[advisories]
version = 2
# RUSTSEC-2024-0449: unsafe-libyaml is archived and receives no fixes. It is reached only through
# serde_yaml, in the development tool xtask, which is not published and reads only the local
# profile data. Replacing the YAML parser is a separate decision, pending the maintainer.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "development tool xtask only; not published; replacing serde_yaml is pending" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Only the fuzzing tool (fuzz/, libfuzzer-sys and its compiler-rt code) is
    # under NCSA. It is never shipped: the library crates do not depend on it.
    # Approved by the maintainer (see docs/ai-log/C7.md).
    "NCSA",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
