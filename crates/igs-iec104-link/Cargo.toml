[package]
name = "igs-iec104-link"
version = "0.1.0"
description = "Sans-I/O APCI session state machine for IEC 60870-5-104: no I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/igs-iec104-link"
keywords = ["iec104", "iec60870", "scada", "telecontrol"]
categories = ["network-programming"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[dependencies]
igs-iec104-codec = { path = "../igs-iec104-codec", version = "0.1.0" }
