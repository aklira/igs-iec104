[package]
name = "igs-iec104"
version = "0.1.0"
description = "Async IEC 60870-5-104 client and server with redundancy and TLS."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[features]
# The rustls backend (task X1): TLS 1.2 and 1.3 with the cipher suites of the TLS profile that
# rustls implements. Enabled by default.
default = ["rustls"]
rustls = ["dep:rustls", "dep:tokio-rustls"]

[dependencies]
igs-iec104-codec = { path = "../igs-iec104-codec", version = "0.1.0" }
igs-iec104-link = { path = "../igs-iec104-link", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# rustls with the ring provider (task X1). ring is Apache-2.0 AND ISC; it adds a second windows-sys,
# which cargo deny reports as a duplicate warning.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
# tokio-rustls adapts a rustls connection to tokio streams (task X1, approved by the maintainer).
# Its default provider is aws-lc-rs, which is left out: the ring provider above is used.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"], optional = true }

[dev-dependencies]
# test-util gives tokio::time::pause (approved for T1, see docs/ai-log/T1.md).
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
# proptest is the dev dependency approved for C6 (docs/ai-log/C6.md).
proptest = "1.11.0"

[[example]]
# The TLS example uses the rustls backend, so it is built only with that feature.
name = "tls"
required-features = ["rustls"]

[[bin]]
name = "igs104-client"
path = "src/bin/igs104_client.rs"

[[bin]]
name = "igs104-server"
path = "src/bin/igs104_server.rs"
