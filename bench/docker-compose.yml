#
# Interop bench. Reference peers run as separate containers and are used as
# black boxes only (IMPLEMENTATION.md section 1, rule 1). Both peers use the
# same FledgePower image: its IEC 104 north plugin is the reference server,
# its IEC 104 south plugin is the reference client. Image and licence were
# approved by a maintainer (task F4, see docs/ai-log/F4.md).
#
# Fixed addresses: the reference client is configured with the server IP.

x-fledgepower: &fledgepower
  image: ghcr.io/aklira/fledgepower/fledge@sha256:0fcb16a7b88cef1e0f59065612f1b6b99bc16d63d39f797812be94df4092d8f1
  # The image's own start script builds a full gateway (south, north, kafka
  # and a control pipeline); the bench instead starts Fledge and creates
  # exactly one service per container from a JSON definition.
  entrypoint: ["/bin/bash", "/bench/peer/bootstrap.sh"]
  volumes:
    - ./peer:/bench/peer:ro

services:
  ref-server:
    <<: *fledgepower
    command: ["/bench/peer/server.json"]
    networks:
      bench:
        ipv4_address: 172.31.104.10

  ref-client:
    <<: *fledgepower
    # BENCH_CLIENT_CONFIG selects the peer the client connects to (L4 uses the probe).
    command: ["${BENCH_CLIENT_CONFIG:-/bench/peer/client.json}"]
    networks:
      bench:
        ipv4_address: 172.31.104.21

  # Shares the network namespace of the reference server so that it sees
  # every frame the server sends and receives. tcpdump writes packet by
  # packet to captures/$BENCH_CAPTURE; the container outlives it so that the
  # helpers can stop it (`pkill tcpdump`) and then run tshark with `exec`.
  capture:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:ref-server"
    depends_on:
      - ref-server
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      - tcpdump -i any -U -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 2404 & exec sleep infinity
    volumes:
      - ./captures:/captures

  # Runs the L4 scenarios inside the bench network (see bench/probe). tcpdump
  # writes every packet the probe exchanges to captures/$BENCH_CAPTURE, as the
  # capture service does for the reference server.
  probe:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    networks:
      bench:
        ipv4_address: 172.31.104.30
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      # --immediate-mode: libpcap otherwise holds packets back, and a short scenario
      # stops tcpdump before it has written any.
      - tcpdump -i any -U --immediate-mode -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 2404 & exec sleep infinity
    volumes:
      - ./captures:/captures
      - ./bin:/bench/bin:ro

  # The S5 interop matrix (tests/test_s5_interop_matrix.py) runs in its own profile. The station under test is
  # the igs104-server binary, built for the static target into bench/bin, on the bench network.
  s5-server:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    profiles: ["s5"]
    networks:
      bench:
        ipv4_address: 172.31.104.40
    command: ["/bench/bin/igs104-server", "--bind", "0.0.0.0:2404", "--common-address", "45", "--points", "/bench/s5/points.toml"]
    volumes:
      - ./bin:/bench/bin:ro
      - ./peer/s5:/bench/s5:ro

  # The second reference peer (bench/peer/j60870): a controlling station that runs one procedure per exec.
  s5-peer:
    build: ./peer/j60870
    image: igs-iec104-j60870:bench
    profiles: ["s5"]
    networks:
      bench:
        ipv4_address: 172.31.104.41

  # The S5 load test (tests/test_s5_load.py): the station with 10 000 points, under the profile `load`. The
  # points file is generated by igs_bench/load.py into bench/load/ (not committed).
  load-server:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    profiles: ["load"]
    networks:
      bench:
        ipv4_address: 172.31.104.50
    command: ["/bench/bin/igs104-server", "--bind", "0.0.0.0:2404", "--common-address", "45", "--points", "/bench/load/points.toml"]
    volumes:
      - ./bin:/bench/bin:ro
      - ./load:/bench/load:ro

networks:
  bench:
    ipam:
      config:
        - subnet: 172.31.104.0/24
