[project]
name = "igs-bench"
version = "0.0.0"
description = "Interop bench for igs-iec104 against black-box reference peers"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
